version: "3.8"

services:
  back-end:
    build:
      context: ./backend
    container_name: back-end
    working_dir: /usr/src/app
    networks:
      - node-network
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    tty: true
    ports:
      - "8080:8080"
    command: npm run start

networks:
  node-network:
    driver: bridge
